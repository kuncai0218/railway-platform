<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">铁路沿线多时相遥感风险识别总体技术路线</title>
<desc id="desc">保持原首页总体技术路线的全部主要节点位置、蓝青橙配色与双层次排布，仅补入10月23日研究状态。三测点Sentinel-2两路线滚动三折完成；高分拟购待核验；SAR仅消融、DEM已用；922窗口完成AI辅助可观测性复核，外部模型验证待做；河岸10米分析已做，高分近同期验证待做。</desc>
<defs><marker id="a-navy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#184a78"/></marker><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#0a8694"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#d86614"/></marker></defs>
<rect width="1600" height="900" fill="#fbfcfe"/>
