<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">D2LS：用动态类别字典辅助五类分割</title><desc id="desc">D2LS使用ConvNeXt-Base四级特征，动态五类字典根据当前影像调整类别表征，与影像特征进行三轮双向交互后生成水体植被耕地裸露建成五类概率。字典可以理解为各类参照卡片，交互是像元找类别与类别回看全图。</desc>
<defs><marker id="a-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#184a78"/></marker><marker id="a-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0a8694"/></marker><marker id="a-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d86614"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif;font-size:24px;fill:#353b40}.title{font-size:32px;font-weight:750;fill:#184a78}.bold{font-weight:700}</style>
<rect width="1200" height="590" fill="#fbfcfe"/>
<text x="35" y="47" text-anchor="start" style="font-size:32px;fill:#184a78;font-weight:700">D2LS：用动态类别字典辅助五类分割</text>
<text x="35" y="91" text-anchor="start" style="font-size:24px;fill:#353b40;font-weight:400">类别参照会随当前影像调整，帮助区分相似地物。</text>
<rect x="35" y="185" width="185" height="170" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="127.5" y="223" text-anchor="middle" style="font-size:27px;fill:#184a78;font-weight:700">RGB影像</text>
<text x="127.5" y="263" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">B4 / B3 / B2</text>
<text x="127.5" y="297" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">一幅一期影像</text>
<rect x="265" y="165" width="250" height="210" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="390" y="203" text-anchor="middle" style="font-size:26px;fill:#184a78;font-weight:700">ConvNeXt-Base</text>
<text x="390" y="243" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">提取四级影像特征</text>
<text x="390" y="277" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">浅层看边界细节</text>
<text x="390" y="311" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">深层看整体地物</text>
<rect x="560" y="165" width="365" height="210" rx="10" fill="#f3f9fa" stroke="#0a8694" stroke-width="2"/>
<text x="742.5" y="203" text-anchor="middle" style="font-size:27px;fill:#0a8694;font-weight:700">动态五类字典</text>
<text x="742.5" y="243" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">按当前影像调整类别参照</text>
<text x="742.5" y="277" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">与影像特征来回交互3轮</text>
<text x="742.5" y="311" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">像元找类别，类别看全图</text>
<rect x="975" y="185" width="190" height="170" rx="10" fill="#f3f9fa" stroke="#0a8694" stroke-width="2"/>
<text x="1070" y="223" text-anchor="middle" style="font-size:26px;fill:#0a8694;font-weight:700">五类概率图</text>
<text x="1070" y="263" text-anchor="middle" style="font-size:22px;fill:#353b40;font-weight:400">水体 / 植被 / 耕地</text>
<text x="1070" y="297" text-anchor="middle" style="font-size:22px;fill:#353b40;font-weight:400">裸露 / 建成</text>
<path d="M 220,270 L 265,270" fill="none" stroke="#184a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-navy)"/>
<path d="M 515,270 L 560,270" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<path d="M 925,270 L 975,270" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<text x="600" y="458" text-anchor="middle" style="font-size:27px;fill:#0a8694;font-weight:700">“字典”＝每类地物的参照卡片</text>
<text x="600" y="510" text-anchor="middle" style="font-size:27px;fill:#184a78;font-weight:700">“交互”＝像元与类别反复交换信息</text>
</svg>
