<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">先分割后检测：一个D2LS网络＋一个树分类器</title><desc id="desc">前后两期RGB影像分别送入同一组权重的D2LS ConvNeXt-Base网络，网络分别输出两期五类概率。语义概率和光谱变化、邻域上下文形成特征，送入一个HistGradientBoostingClassifier，输出变化图。开发期使用交叉拟合概率，测试期使用全开发期训练的同一分割方法。</desc>
<defs><marker id="a-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#184a78"/></marker><marker id="a-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#0a8694"/></marker><marker id="a-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d86614"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif;font-size:24px;fill:#353b40}.title{font-size:32px;font-weight:750;fill:#184a78}.bold{font-weight:700}</style>
<rect width="1200" height="650" fill="#fbfcfe"/>
<text x="35" y="47" text-anchor="start" style="font-size:32px;fill:#184a78;font-weight:700">先分割后检测：一个D2LS网络＋一个树分类器</text>
<text x="35" y="91" text-anchor="start" style="font-size:24px;fill:#353b40;font-weight:400">先解释每期是什么地物，再结合光谱与上下文判断是否真实变化。</text>
<rect x="35" y="170" width="210" height="100" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="140" y="208" text-anchor="middle" style="font-size:25px;fill:#184a78;font-weight:700">前期RGB影像</text>
<text x="140" y="248" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">B4 / B3 / B2</text>
<rect x="35" y="320" width="210" height="100" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="140" y="358" text-anchor="middle" style="font-size:25px;fill:#184a78;font-weight:700">后期RGB影像</text>
<text x="140" y="398" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">B4 / B3 / B2</text>
<rect x="300" y="180" width="320" height="220" rx="10" fill="#f3f9fa" stroke="#0a8694" stroke-width="2"/>
<text x="460" y="218" text-anchor="middle" style="font-size:24px;fill:#0a8694;font-weight:700">D2LS–ConvNeXt-Base</text>
<text x="460" y="258" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">RGB五类分割</text>
<text x="460" y="292" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">同一组网络权重</text>
<text x="460" y="326" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">分别处理前后两期</text>
<path d="M 245,220 L 300,220" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<path d="M 245,370 L 300,370" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<rect x="690" y="170" width="220" height="100" rx="10" fill="#f3f9fa" stroke="#0a8694" stroke-width="2"/>
<text x="800" y="208" text-anchor="middle" style="font-size:25px;fill:#0a8694;font-weight:700">前期五类概率</text>
<text x="800" y="248" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">每一类的判断把握</text>
<rect x="690" y="320" width="220" height="100" rx="10" fill="#f3f9fa" stroke="#0a8694" stroke-width="2"/>
<text x="800" y="358" text-anchor="middle" style="font-size:25px;fill:#0a8694;font-weight:700">后期五类概率</text>
<text x="800" y="398" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">每一类的判断把握</text>
<path d="M 620,220 L 690,220" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<path d="M 620,370 L 690,370" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<rect x="960" y="210" width="205" height="170" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="1062.5" y="248" text-anchor="middle" style="font-size:26px;fill:#184a78;font-weight:700">变化特征</text>
<text x="1062.5" y="288" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">语义＋光谱</text>
<text x="1062.5" y="322" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">邻域上下文</text>
<path d="M 910,220 L 935,220 L 935,260 L 960,260" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<path d="M 910,370 L 935,370 L 935,330 L 960,330" fill="none" stroke="#0a8694" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<rect x="555" y="505" width="395" height="110" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="752.5" y="543" text-anchor="middle" style="font-size:22px;fill:#184a78;font-weight:700">HistGradientBoostingClassifier</text>
<text x="752.5" y="583" text-anchor="middle" style="font-size:22px;fill:#353b40;font-weight:400">一个直方图梯度提升树分类器</text>
<rect x="1000" y="505" width="165" height="110" rx="10" fill="#f1f6fb" stroke="#184a78" stroke-width="2"/>
<text x="1082.5" y="543" text-anchor="middle" style="font-size:27px;fill:#184a78;font-weight:700">变化图</text>
<text x="1082.5" y="583" text-anchor="middle" style="font-size:24px;fill:#353b40;font-weight:400">哪里变了</text>
<path d="M 1062,380 L 1062,458 L 752,458 L 752,505" fill="none" stroke="#184a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-navy)"/>
<path d="M 950,560 L 1000,560" fill="none" stroke="#184a78" stroke-width="3" stroke-linejoin="round" marker-end="url(#a-navy)"/>
<text x="50" y="531" text-anchor="start" style="font-size:23px;fill:#0a8694;font-weight:700">先分割：这一期是什么地物</text>
<text x="50" y="573" text-anchor="start" style="font-size:23px;fill:#184a78;font-weight:700">再检测：两期之间哪里变化</text>
</svg>
