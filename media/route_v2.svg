<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">铁路沿线多时相遥感风险识别总体技术路线</title>
<desc id="desc">原首页总体技术路线（2026-09-28）的版式、节点位置与配色不变；2026-10-26 按实验结果调整：SAR 影像、DEM 地形数据与多期历史影像改为可选输入（目前实验中没有带来稳定增益），路线A写明候选像元与判别器。</desc>
<defs><marker id="a-navy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#184a78"/></marker><marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#0a8694"/></marker><marker id="a-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#d86614"/></marker><marker id="a-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8 Z" fill="#9aa6b2"/></marker></defs>
<rect width="1600" height="900" fill="#fbfcfe"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif} .h1{font-size:46px;font-weight:750}.h2{font-size:25px;font-weight:700}.h3{font-size:24px;font-weight:700}.body{font-size:19px}.note{font-size:17px}.opt{font-size:15px;font-weight:600}</style>
<text x="800" y="60" class="h1" fill="#184a78" text-anchor="middle">铁路沿线多时相遥感风险识别总体技术路线</text>
<text x="800" y="98" class="body" fill="#707983" text-anchor="middle">两个实验层次共用技术流程，分别组织样本、实验划分与结果</text>
<line x1="60" y1="112" x2="800" y2="112" stroke="#184a78" stroke-width="4"/>
<line x1="800" y1="112" x2="1172" y2="112" stroke="#0a8694" stroke-width="4"/>
<line x1="1172" y1="112" x2="1540" y2="112" stroke="#d86614" stroke-width="4"/>
<text x="60" y="142" class="h2" fill="#184a78" text-anchor="start">01 实验层次</text>
<rect x="60" y="154" width="550" height="80" rx="9" fill="#f1f6fb" stroke="#bfd4e6" stroke-width="1.5"/>
<text x="80" y="183" class="h3" fill="#184a78" text-anchor="start">层次一 三个测点初步探究</text>
<text x="80" y="216" class="body" fill="#353b40" text-anchor="start">株洲南、衡阳北、韶关南：建立流程并比较方法</text>
<rect x="920" y="154" width="620" height="80" rx="9" fill="#f1f6fb" stroke="#bfd4e6" stroke-width="1.5"/>
<text x="940" y="183" class="h3" fill="#184a78" text-anchor="start">层次二 全量台账事件研究</text>
<text x="940" y="216" class="body" fill="#353b40" text-anchor="start">依台账组织多地点样本，检验不同事件中的适用性</text>
<path d="M 610,194 L 920,194" fill="none" stroke="#184a78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-navy)" stroke-dasharray="8 9"/>
<text x="765" y="181" class="note" fill="#184a78" text-anchor="middle">标注规范与研究方法推广</text>
<text x="800" y="261" class="body" fill="#707983" text-anchor="middle">两个层次均包含Sentinel-2与高分辨率影像研究</text>
<text x="60" y="295" class="h2" fill="#184a78" text-anchor="start">02 共用数据与样本准备</text>
<rect x="60" y="306.3" width="555" height="50" rx="9" fill="white" stroke="#bfd4e6" stroke-width="1.5"/>
<text x="337.5" y="328" class="h3" fill="#184a78" text-anchor="middle" style="font-size:21px">光学：Sentinel-2（10 m）与亚米级影像</text>
<text x="337.5" y="348" class="opt" fill="#707983" text-anchor="middle">主要输入；更早的历史影像（往年同期等）可选</text>
<rect x="635" y="306.3" width="265" height="50" rx="9" fill="white" stroke="#9fcfd6" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="767.5" y="328" class="h3" fill="#0a8694" text-anchor="middle" style="font-size:20px">辅助（可选）：SAR影像</text>
<text x="767.5" y="348" class="opt" fill="#707983" text-anchor="middle">目前实验中无稳定增益</text>
<rect x="920" y="306.3" width="295" height="50" rx="9" fill="white" stroke="#efbf9b" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="1067.5" y="328" class="h3" fill="#d86614" text-anchor="middle" style="font-size:20px">辅助（可选）：DEM地形数据</text>
<text x="1067.5" y="348" class="opt" fill="#707983" text-anchor="middle">目前实验中无稳定增益</text>
