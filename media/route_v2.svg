<path d="M 767.5,356.3 L 767.5,387.5" fill="none" stroke="#0a8694" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)" stroke-dasharray="5 5"/>
<path d="M 1067.5,356.3 L 1067.5,387.5" fill="none" stroke="#d86614" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)" stroke-dasharray="5 5"/>
