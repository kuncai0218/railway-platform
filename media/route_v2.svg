<text x="1265" y="343" class="h2" fill="#0a8694" text-anchor="start" style="font-size:26px">河岸线研究</text>
<text x="1265" y="371" class="body" fill="#353b40" text-anchor="start" style="font-size:18px">衔接路线A的水体分割</text>
<text x="1265" y="411" class="body" fill="#353b40" text-anchor="start" style="font-size:19px">水域范围、水边线与河宽</text>
<text x="1265" y="434" class="body" fill="#353b40" text-anchor="start" style="font-size:19px">季节性与持续变化分析</text>
<text x="1265" y="457" class="body" fill="#353b40" text-anchor="start" style="font-size:19px">两个层次中的适用河段</text>
