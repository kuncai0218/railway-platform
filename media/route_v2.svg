<text x="78" y="438" class="note" fill="#707983" text-anchor="start">质量记录、成像条件与辅助时相</text>
<text x="462" y="414" class="h3" fill="#184a78" text-anchor="start" style="font-size:22px">空间对齐与误差检查</text>
<text x="462" y="438" class="note" fill="#707983" text-anchor="start">统一坐标与网格，核查残余误差</text>
<text x="849" y="414" class="h3" fill="#184a78" text-anchor="start" style="font-size:22px">人工判读与数据标注</text>
<text x="849" y="438" class="note" fill="#707983" text-anchor="start">分割标签、变化标签与质量记录</text>
