<text x="335" y="559" class="h3" fill="#0a8694" text-anchor="middle" style="font-size:22px">前后两期地物语义分割</text>
<path d="M 335,567 L 335,589" fill="none" stroke="#0a8694" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/>
<text x="335" y="612" class="body" fill="#353b40" text-anchor="middle" style="font-size:21px">比较地物状态，生成初始变化结果</text>
<text x="335" y="633" class="opt" fill="#0a8694" text-anchor="middle">再由候选像元与判别器区分真假变化</text>
<line x1="80" y1="642" x2="590" y2="642" stroke="#c3dde1" stroke-width="1.2"/>
<text x="335" y="661" class="h3" fill="#0a8694" text-anchor="middle" style="font-size:20px">已有方法试验｜自研新方法</text>
<rect x="665" y="495" width="550" height="173.7" rx="9" fill="#fef8f3" stroke="#f4c8a7" stroke-width="1.5"/>
