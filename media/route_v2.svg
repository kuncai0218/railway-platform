<text x="940" y="559" class="h3" fill="#d86614" text-anchor="middle" style="font-size:22px">输入前后两期影像</text>
<path d="M 940,567 L 940,589" fill="none" stroke="#d86614" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<text x="940" y="612" class="body" fill="#353b40" text-anchor="middle" style="font-size:21px">直接识别变化区域与范围</text>
<text x="940" y="633" class="opt" fill="#d86614" text-anchor="middle">更早的多期历史影像：可选输入</text>
<line x1="685" y1="642" x2="1195" y2="642" stroke="#f0d5c1" stroke-width="1.2"/>
<text x="940" y="661" class="h3" fill="#d86614" text-anchor="middle" style="font-size:20px">已有方法试验｜自研新方法</text>
<line x1="335" y1="668.7" x2="335" y2="691.7" stroke="#0a8694" stroke-width="2.5"/>
<line x1="335" y1="691.7" x2="637.5" y2="691.7" stroke="#0a8694" stroke-width="2.5"/>
<line x1="940" y1="668.7" x2="940" y2="691.7" stroke="#d86614" stroke-width="2.5"/>
<line x1="940" y1="691.7" x2="637.5" y2="691.7" stroke="#d86614" stroke-width="2.5"/>
<path d="M 637.5,691.7 L 637.5,713.3" fill="none" stroke="#184a78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-navy)"/>
<rect x="161.25" y="713.3" width="952.5" height="82.5" rx="9" fill="#f1f6fb" stroke="#94b9d8" stroke-width="1.7"/>
<text x="637.5" y="746" class="h2" fill="#184a78" text-anchor="middle" style="font-size:26px">共同开展伪变化抑制</text>
<text x="637.5" y="778" class="body" fill="#353b40" text-anchor="middle" style="font-size:18px">云与云影、配准错位、成像差异与边界误差；保留真实季节性变化并说明周期性</text>
<path d="M 637.5,795.8 L 637.5,817.5" fill="none" stroke="#184a78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-navy)"/>
<rect x="161.25" y="817.5" width="952.5" height="66.7" rx="9" fill="#eff5fc" stroke="#4287bc" stroke-width="1.5"/>
<text x="637.5" y="846" class="h2" fill="#184a78" text-anchor="middle" style="font-size:25px">精度评估与最优方案</text>
<text x="637.5" y="871" class="note" fill="#707983" text-anchor="middle" style="font-size:17px">识别精度、误报/漏报、边界质量与跨地区适用性</text>
<path d="M 1113.75,850.85 L 1247.5,850.85" fill="none" stroke="#184a78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-navy)"/>
<rect x="1247.5" y="817.5" width="292.5" height="66.7" rx="9" fill="#eff5fc" stroke="#4287bc" stroke-width="1.5"/>
<text x="1393.75" y="845" class="h3" fill="#184a78" text-anchor="middle" style="font-size:19px">已有方法比较</text>
<text x="1393.75" y="870" class="h3" fill="#184a78" text-anchor="middle" style="font-size:19px">主要问题分析与方法改进</text>
<text x="1247.5" y="295" class="h2" fill="#184a78" text-anchor="start">专题拓展</text>
