<text x="1265" y="568" class="h2" fill="#184a78" text-anchor="start" style="font-size:26px">灾前线索分析</text>
<text x="1265" y="594" class="h3" fill="#184a78" text-anchor="start" style="font-size:20px">台账事件的深入研究</text>
